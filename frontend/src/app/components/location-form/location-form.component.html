<h2 mat-dialog-title>{{ isEdit ? 'Edit Location' : 'Add Location' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-container">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required>
    </mat-form-field>
    
    <mat-form-field appearance="outline">
      <mat-label>Category</mat-label>
      <mat-select formControlName="category" required>
        <mat-option *ngFor="let cat of categories" [value]="cat.id">
          {{ cat.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    
    <div class="row">
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Latitude</mat-label>
        <input matInput type="number" formControlName="latitude" required>
      </mat-form-field>
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Longitude</mat-label>
        <input matInput type="number" formControlName="longitude" required>
      </mat-form-field>
    </div>
    
    <div class="row">
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Floor</mat-label>
        <input matInput formControlName="floor">
      </mat-form-field>
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>Building ID</mat-label>
        <input matInput formControlName="buildingId">
      </mat-form-field>
    </div>
    
    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>
    
    <div class="checkboxes">
      <mat-checkbox formControlName="isAccessible">Wheelchair Accessible</mat-checkbox>
      <mat-checkbox formControlName="isDelivery">Delivery Allowed</mat-checkbox>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="save()">Save</button>
</mat-dialog-actions>
