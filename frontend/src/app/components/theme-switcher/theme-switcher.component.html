<button mat-icon-button [matMenuTriggerFor]="themeMenu" aria-label="Toggle theme">
  <mat-icon>palette</mat-icon>
</button>
<mat-menu #themeMenu="matMenu">
  <button mat-menu-item (click)="setTheme('light')">
    <mat-icon>light_mode</mat-icon>
    <span>Light</span>
    <mat-icon *ngIf="currentTheme === 'light'">check</mat-icon>
  </button>
  <button mat-menu-item (click)="setTheme('dark')">
    <mat-icon>dark_mode</mat-icon>
    <span>Dark</span>
    <mat-icon *ngIf="currentTheme === 'dark'">check</mat-icon>
  </button>
  <button mat-menu-item (click)="setTheme('high-contrast')">
    <mat-icon>contrast</mat-icon>
    <span>High Contrast</span>
    <mat-icon *ngIf="currentTheme === 'high-contrast'">check</mat-icon>
  </button>
</mat-menu>
